trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

# ============================================================
# CI - Runs on push to remote repository
# ============================================================

- stage: CI
  displayName: "CI - Terraform Validation & Security"

  condition: ne(variables['Build.SourceBranch'], 'refs/heads/main')

  jobs:
  - job: Terraform_CI
    displayName: "Terraform CI"

    steps:

    - checkout: self
      fetchDepth: 0

    # Install Terraform
    - script: |
        sudo apt-get update
        sudo apt-get install -y unzip
        wget -q https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
        unzip terraform_1.9.8_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: "Install Terraform"

    # Terraform Format
    - script: |
        terraform fmt -check -recursive
      displayName: "Terraform Format Check"

    # Terraform Init
    - script: |
        terraform init -backend=false
      displayName: "Terraform Init"

    # Terraform Validate
    - script: |
        terraform validate
      displayName: "Terraform Validate"

    # TFLint
    - script: |
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
        tflint --version
        tflint --init
        tflint
      displayName: "TFLint Security / Quality Check"

    # tfsec
    - script: |
        curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
        tfsec .
      displayName: "tfsec Security Scan"

    # Gitleaks
    - script: |
        curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | sh -s -- -b /usr/local/bin
        gitleaks version
        gitleaks detect --source . --no-banner --redact
      displayName: "Gitleaks Secret Scan"


# ============================================================
# CD - Runs after merge into main
# Security checks run again + Terraform Plan
# ============================================================

- stage: CD
  displayName: "CD - Security Recheck & Terraform Plan"

  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')

  jobs:
  - job: Terraform_Plan
    displayName: "Terraform Plan"

    steps:

    - checkout: self
      fetchDepth: 0

    # Install Terraform
    - script: |
        sudo apt-get update
        sudo apt-get install -y unzip
        wget -q https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
        unzip terraform_1.9.8_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform version
      displayName: "Install Terraform"

    # Terraform Init
    - script: |
        terraform init -backend=false
      displayName: "Terraform Init"

    # TFLint Recheck
    - script: |
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
        tflint --version
        tflint --init
        tflint
      displayName: "TFLint Recheck"

    # tfsec Recheck
    - script: |
        curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
        tfsec .
      displayName: "tfsec Recheck"

    # Gitleaks Recheck
    - script: |
        curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | sh -s -- -b /usr/local/bin
        gitleaks version
        gitleaks detect --source . --no-banner --redact
      displayName: "Gitleaks Recheck"

    # Terraform Format
    - script: |
        terraform fmt -check -recursive
      displayName: "Terraform Format Check"

    # Terraform Validate
    - script: |
        terraform validate
      displayName: "Terraform Validate"

    # Terraform Plan
    - script: |
        terraform plan -out=tfplan
      displayName: "Terraform Plan"
